[package]
name = "luchs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
cef = ["jackstay/backend-macos"]

[dependencies]
jackstay.workspace = true
jackstay-producer.workspace = true
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rustix = { version = "1", features = ["fs", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
# Already locked through Jackstay: helper job objects, pipe disconnect and
# payload handle duplication (docs/helper-protocol.md).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
