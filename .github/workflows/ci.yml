name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - run: cargo +1.98.0 fmt --all --check
      - run: cargo +stable build --workspace --locked
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - if: runner.os == 'macOS'
        run: scripts/build-helper.sh
      - if: runner.os == 'macOS'
        run: scripts/test-helper.sh
