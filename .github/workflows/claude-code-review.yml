name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    uses: flotilla-org/.github/.github/workflows/claude-review.yml@v1-canary
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    with:
      guidance: "the repository's README.md and docs/"
      model: claude-sonnet-5-5
    secrets: inherit
