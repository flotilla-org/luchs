[workspace]
resolver = "3"
members = ["crates/luchs"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/flotilla-org/luchs"

[workspace.dependencies]
jackstay = { git = "https://github.com/flotilla-org/jackstay", rev = "ed785976df1246d2d3ce3f0c41df91c02f38e20d" }

jackstay-producer = { git = "https://github.com/flotilla-org/jackstay", rev = "ed785976df1246d2d3ce3f0c41df91c02f38e20d" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
