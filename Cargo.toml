[workspace]
resolver = "3"
members = ["crates/luchs"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/flotilla-org/luchs"

[workspace.dependencies]
# Keep Jackstay and its producer toolkit at the same revision.
jackstay = { git = "https://github.com/flotilla-org/jackstay", rev = "6516094b8f4335b54d06bba8586a64d67ab0d9c6" }
jackstay-producer = { git = "https://github.com/flotilla-org/jackstay", rev = "6516094b8f4335b54d06bba8586a64d67ab0d9c6" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
