[workspace]
resolver = "3"
members = ["crates/luchs"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/flotilla-org/luchs"

[workspace.dependencies]
# Keep Jackstay and its producer toolkit at the same revision.
jackstay = { git = "https://github.com/flotilla-org/jackstay", rev = "5fcc8dc285dcb059f9ceb9f976cfb3b8db8b15e2" }
jackstay-producer = { git = "https://github.com/flotilla-org/jackstay", rev = "5fcc8dc285dcb059f9ceb9f976cfb3b8db8b15e2" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
