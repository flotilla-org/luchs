[workspace]
resolver = "3"
members = ["crates/luchs"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/flotilla-org/luchs"

[workspace.dependencies]
# Keep Jackstay and its producer toolkit at the same revision.
jackstay = { git = "https://github.com/flotilla-org/jackstay", rev = "276900db59b9c651b1f5a83427a6f498265770fd" }
jackstay-producer = { git = "https://github.com/flotilla-org/jackstay", rev = "276900db59b9c651b1f5a83427a6f498265770fd" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
