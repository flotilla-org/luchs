[workspace]
resolver = "3"
members = ["crates/luchs"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/flotilla-org/luchs"

[workspace.dependencies]
# Keep Jackstay and its producer toolkit at the same revision.
jackstay = { git = "https://github.com/flotilla-org/jackstay", rev = "9e6f145e5f9f2d1ba5732b0672a5ba6fb7c4b9ad" }
jackstay-producer = { git = "https://github.com/flotilla-org/jackstay", rev = "9e6f145e5f9f2d1ba5732b0672a5ba6fb7c4b9ad" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
