[workspace]
resolver = "3"
members = ["crates/luchs"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/flotilla-org/luchs"

[workspace.dependencies]
# Keep Jackstay and its producer toolkit at the same revision.
jackstay = { git = "https://github.com/flotilla-org/jackstay", rev = "e5ad1a61e7317e0c6287216330b6104c5d415e96" }
jackstay-producer = { git = "https://github.com/flotilla-org/jackstay", rev = "e5ad1a61e7317e0c6287216330b6104c5d415e96" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
